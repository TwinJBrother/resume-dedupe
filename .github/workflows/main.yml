name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: |
          CSPROJ=$(find . -name ResumeDedupe.csproj | head -n 1)
          echo "META=$(dirname "$CSPROJ")/meta.json" >> "$GITHUB_ENV"
          dotnet publish "$CSPROJ" -c Release -o out --nologo -p:DebugType=none
      - name: Empacotar e gerar o manifesto do Jellyfin
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, zipfile

          meta = json.load(open(os.environ["META"], encoding="utf-8"))
          ver = meta["version"]
          zip_name = f"ResumeDedupe_{ver}.zip"

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("out/Jellyfin.Plugin.ResumeDedupe.dll", "Jellyfin.Plugin.ResumeDedupe.dll")
              z.write(os.environ["META"], "meta.json")

          md5 = hashlib.md5(open(zip_name, "rb").read()).hexdigest()
          url = f"https://github.com/{os.environ['REPO']}/releases/download/v{ver}/{zip_name}"
          manifest = [{
              "guid": meta["guid"],
              "name": meta["name"],
              "description": meta["description"],
              "overview": meta["overview"],
              "owner": os.environ["OWNER"],
              "category": meta["category"],
              "versions": [{
                  "version": ver,
                  "changelog": f"Resume Dedupe {ver}",
                  "targetAbi": meta["targetAbi"],
                  "sourceUrl": url,
                  "checksum": md5,
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }],
          }]
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VER={ver}\nZIP={zip_name}\n")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Resume Dedupe ${{ env.VER }}
          files: |
            ${{ env.ZIP }}
            manifest.json
