<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Resume Dedupe</title>
</head>
<body>
<div id="ResumeDedupeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <h2>Resume Dedupe</h2>
            <form id="ResumeDedupeForm">
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="chkDedupe" name="chkDedupe" type="checkbox" is="emby-checkbox" />
                        <span>Deduplicar Continuar Assistindo</span>
                    </label>
                    <div class="fieldDescription">Mostra so o episodio mais recente de cada serie.</div>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="chkNextUp" name="chkNextUp" type="checkbox" is="emby-checkbox" />
                        <span>Esconder do Next Up as series que ja estao em Continuar Assistindo</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="txtMax">Episodios por serie em Continuar Assistindo</label>
                    <input id="txtMax" name="txtMax" type="number" is="emby-input" min="1" max="10" />
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Salvar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var ResumeDedupeConfig = { pluginUniqueId: '7c1d9f4e-2b6a-4e0f-9a53-3d8b1c5e7a21' };

        document.querySelector('#ResumeDedupeConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(ResumeDedupeConfig.pluginUniqueId).then(function (config) {
                document.querySelector('#chkDedupe').checked = config.DedupeContinueWatching;
                document.querySelector('#chkNextUp').checked = config.HideNextUpInContinueWatching;
                document.querySelector('#txtMax').value = config.MaxEpisodesPerSeries;
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector('#ResumeDedupeForm').addEventListener('submit', function (e) {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(ResumeDedupeConfig.pluginUniqueId).then(function (config) {
                config.DedupeContinueWatching = document.querySelector('#chkDedupe').checked;
                config.HideNextUpInContinueWatching = document.querySelector('#chkNextUp').checked;
                config.MaxEpisodesPerSeries = Math.min(10, Math.max(1, parseInt(document.querySelector('#txtMax').value, 10) || 1));
                ApiClient.updatePluginConfiguration(ResumeDedupeConfig.pluginUniqueId, config).then(Dashboard.processPluginConfigurationUpdateResult);
            });
            e.preventDefault();
            return false;
        });
    </script>
</div>
</body>
</html>
