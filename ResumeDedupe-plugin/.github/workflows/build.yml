name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: |
          CSPROJ=$(find . -name ResumeDedupe.csproj | head -n 1)
          echo "Projeto: $CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o out
      - name: Package
        run: |
          META=$(find . -name meta.json -path '*ResumeDedupe*' | head -n 1)
          mkdir -p pkg/ResumeDedupe_1.1.0.0
          cp out/Jellyfin.Plugin.ResumeDedupe.dll pkg/ResumeDedupe_1.1.0.0/
          cp "$META" pkg/ResumeDedupe_1.1.0.0/
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeDedupe_1.1.0.0
          path: pkg
