name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          CSPROJ=$(find . -name ResumeDedupe.csproj | head -n 1)
          echo "Projeto: $CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o out

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' $(find . -name ResumeDedupe.csproj))
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          META=$(find . -name meta.json -path '*ResumeDedupe*' | head -n 1)
          mkdir -p pkg/ResumeDedupe_${{ steps.version.outputs.version }}
          cp out/Jellyfin.Plugin.ResumeDedupe.dll pkg/ResumeDedupe_${{ steps.version.outputs.version }}/
          cp "$META" pkg/ResumeDedupe_${{ steps.version.outputs.version }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ResumeDedupe_${{ steps.version.outputs.version }}
          path: pkg
